name: macOS builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify the disk image
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version)."
            exit 1
          fi
          ./app/build_dmg.sh
          test -s "app/dist/LiveMark-$version-$EXPECTED_ARCH.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livemark-${{ matrix.arch }}
          path: app/dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: livemark-*
          path: release
          merge-multiple: true
      - name: Publish both installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/LiveMark-$version-arm64.dmg" \
            "release/LiveMark-$version-x86_64.dmg" \
            --verify-tag \
            --title "LiveMark $version" \
            --notes-file - <<'NOTES'
          LiveMark 是面向 macOS 的 Typora 开源替代方案。

          - Apple 芯片请选择 `arm64`，Intel 芯片请选择 `x86_64`。
          - 最低要求 macOS 13。打开 DMG 后，将 LiveMark 拖入“应用程序”。
          - 安装包使用 ad-hoc 签名，未经 Apple 公证，首次打开可能被 Gatekeeper 拦截。
          NOTES
